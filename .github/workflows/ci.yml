name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK (pinned)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/MerqoVertexa.sln

      - name: Build (warnings as errors)
        run: dotnet build src/MerqoVertexa.sln -c Release --no-restore -p:TreatWarningsAsErrors=true 2>&1 | Tee-Object -FilePath build.log

      - name: Publish build errors to step summary on failure
        if: failure()
        shell: pwsh
        run: |
          $err = Select-String -Path build.log -Pattern 'error' | Select-Object -First 30
          "````````````````````" | Out-File -Append $GITHUB_STEP_SUMMARY
          "## Build errors" | Out-File -Append $GITHUB_STEP_SUMMARY
          $err | ForEach-Object { $_.Line } | Out-File -Append $GITHUB_STEP_SUMMARY

      - name: Dependency vulnerability audit
        run: dotnet list src/MerqoVertexa.sln package --vulnerable --include-transitive

      - name: Run tests
        run: dotnet test src/MerqoVertexa.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
