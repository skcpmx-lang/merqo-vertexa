name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK (pinned)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/MerqoVertexa.sln

      - name: Build Core
        continue-on-error: true
        run: dotnet build src/Merqo.Vertexa.Core/Merqo.Vertexa.Core.csproj -c Release --no-restore 2>&1 | tail -5

      - name: Build App
        continue-on-error: true
        run: dotnet build src/Merqo.Vertexa.App/Merqo.Vertexa.App.csproj -c Release --no-restore 2>&1 | tail -5

      - name: Build Tests
        continue-on-error: true
        run: dotnet build tests/Merqo.Vertexa.Core.Tests/Merqo.Vertexa.Core.Tests.csproj -c Release --no-restore 2>&1 | tail -5

      - name: Build solution (warnings as errors)
        run: dotnet build src/MerqoVertexa.sln -c Release --no-restore -p:TreatWarningsAsErrors=true

      - name: Post build log as commit comment on failure (debug)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '## Build errors'; echo '```'; grep -iE 'error' build.log | sort -u | head -40; echo '```'; } > /tmp/body.json
          jq -n --arg b "$(cat /tmp/body.json)" '{body: $b}' > /tmp/payload.json
          gh api repos/"$GITHUB_REPOSITORY"/commits/"$GITHUB_SHA"/comments -f body="$(cat /tmp/body.json)" || true

      - name: Dependency vulnerability audit
        run: dotnet list src/MerqoVertexa.sln package --vulnerable --include-transitive

      - name: Run tests
        run: dotnet test src/MerqoVertexa.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
