name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK (pinned)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/Merqo.Vertexa.App/Merqo.Vertexa.App.csproj
      - name: Restore tests
        run: dotnet restore tests/Merqo.Vertexa.Core.Tests/Merqo.Vertexa.Core.Tests.csproj

      - name: Build solution
        run: |
        dotnet build src/Merqo.Vertexa.App/Merqo.Vertexa.App.csproj -c Release --no-restore
        dotnet build tests/Merqo.Vertexa.Core.Tests/Merqo.Vertexa.Core.Tests.csproj -c Release --no-restore

      - name: Dependency vulnerability audit
        run: dotnet list src/Merqo.Vertexa.App/Merqo.Vertexa.App.csproj package --vulnerable --include-transitive

      - name: Run tests
        run: dotnet test tests/Merqo.Vertexa.Core.Tests/Merqo.Vertexa.Core.Tests.csproj -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
