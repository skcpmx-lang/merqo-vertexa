name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8 SDK (pinned)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore src/MerqoVertexa.sln

      - name: Build (warnings as errors)
        shell: bash
        run: |
          set -o pipefail
          dotnet build src/MerqoVertexa.sln -c Release --no-restore -p:TreatWarningsAsErrors=true 2>&1 | tee build.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            { echo '## Build errors'; grep -iE 'error [A-Z]+[0-9]+' build.log | sort -u | head -30; } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit $rc

      - name: Post build log as issue on failure (debug)
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          { echo '## Build errors for ' $GITHUB_SHA; echo '```'; grep -iE 'error' build.log | sort -u | head -40; echo '```'; } > /tmp/body.md
          gh issue create --repo "$GITHUB_REPOSITORY" --title "CI build failure $GITHUB_SHA" --body-file /tmp/body.md || true

      - name: Dependency vulnerability audit
        run: dotnet list src/MerqoVertexa.sln package --vulnerable --include-transitive

      - name: Run tests
        run: dotnet test src/MerqoVertexa.sln -c Release --no-build --logger "trx;LogFileName=results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/*.trx
